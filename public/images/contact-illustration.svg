<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#F8F8FC"/>
  
  <!-- Envelope -->
  <path d="M100 100H300V200H100V100Z" fill="#7C3AED"/>
  <path d="M100 100L200 150L300 100" stroke="#4C1D95" stroke-width="4"/>
  
  <!-- Message Lines -->
  <rect x="120" y="130" width="160" height="8" rx="2" fill="#C4B5FD"/>
  <rect x="120" y="150" width="120" height="8" rx="2" fill="#C4B5FD"/>
  <rect x="120" y="170" width="140" height="8" rx="2" fill="#C4B5FD"/>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="80" r="10" fill="#7C3AED" opacity="0.5"/>
  <circle cx="250" cy="80" r="10" fill="#7C3AED" opacity="0.5"/>
  <circle cx="200" cy="220" r="15" fill="#7C3AED" opacity="0.5"/>
  
  <!-- Connection Lines -->
  <path d="M50 150L100 150" stroke="#7C3AED" stroke-width="4" stroke-dasharray="4 4"/>
  <path d="M300 150L350 150" stroke="#7C3AED" stroke-width="4" stroke-dasharray="4 4"/>
</svg> 